

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Champions Dream Factory</title>
    <link rel="stylesheet" href="style.css">
</head>
<audio id="backgroundMusic" loop>
    <source src="music/childrens-day.mp3" type="audio/mpeg">
</audio>

<button id="musicButton" onclick="toggleMusic()">🎵 Play Music</button>
<body>

    <div class="welcome-box">

        <div class="top-label">
            ✨ A SPECIAL CHILDREN'S DAY SURPRISE ✨
        </div>

        <div class="emoji">🌈 🎈 ⭐</div>

        <h1>Hey, Champions!</h1>

        <h2>Welcome to Your Dream Factory</h2>

        <p>
            A little world of dreams, laughter and surprises
            is waiting just for you!
        </p>

        <p class="teacher-text">
            Your teacher has prepared something special ❤️
        </p>

        <button onclick="startJourney()">
            OPEN YOUR SURPRISE ✨
        </button>

        <div class="bottom-text">
            Made with love by Your Teacher ❤️
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
